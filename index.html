<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="週末ふたり旅｜ふたりで行きたい温泉宿を、短いリールと予約導線で紹介。" />
  <meta name="futari-reel-version" content="9.2-singlemoon" />
  <title>週末ふたり旅</title>
  <link rel="stylesheet" href="style.css?v=92-singlemoon" />
</head>
<body>
  <div class="affiliate-note">当サイトはアフィリエイト広告を利用しています</div>

  <header class="hero">
    <div class="hero-overlay"></div>
<nav class="nav wrap">
      <a class="brand" href="#">週末ふたり旅</a>
      <a class="instagram-link" href="https://www.instagram.com/shumatsu_futari_tabi/" target="_blank" rel="noopener">Instagram</a>
    </nav>

    <div class="hero-content wrap">
      <div class="hero-copy">
        <p class="eyebrow">WEEKEND GETAWAY FOR TWO</p>
        <h1>次の休み、<br>ふたりでここへ。</h1>
        <p class="lead">温泉、景色、ごはん。「行きたい」が見つかる宿だけを。</p>
        <a class="cta" href="#featured"><span class="cta-label">今日のおすすめを見る</span><span class="cta-arrow">→</span></a>
      </div>

      <div class="search-panel" aria-label="宿検索">
        <label class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="宿名・地域・特徴で検索" />
        </label>
        <label class="region-box">
          <select id="regionSelect">
            <option value="">すべての地域</option>
          </select>
          <span class="chev">⌄</span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <section id="featured" class="featured wrap">
      <p class="section-eyebrow">FEATURED STAYS</p>
      <h2>紹介した温泉宿</h2>
      <div id="cards" class="stay-grid"></div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <strong>週末ふたり旅</strong>
      <p>掲載情報は作成時点のものです。料金・プラン・設備等は変更される場合があります。予約前に各予約サイト・宿泊施設の最新情報をご確認ください。</p>
      <p>当サイトにはアフィリエイト広告を含む場合があり、リンク経由の予約等により運営者が報酬を受け取ることがあります。</p>
    </div>
  </footer>

  <template id="stayTemplate">
    <article class="stay-card">
      <div class="stay-image-wrap">
        <img class="stay-image" alt="" loading="lazy" />
        <span class="recommend-badge">今週のおすすめ</span>
      </div>
      <div class="stay-body">
        <p class="stay-region"></p>
        <h3 class="stay-name"></h3>
        <p class="stay-copy"></p>
        <div class="stay-actions">
          <a class="reel-btn" target="_blank" rel="noopener">リールを見る</a>
          <a class="book-btn" target="_blank" rel="sponsored noopener">予約を見る</a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js?v=91"></script>
</body>
</html>
